services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: vehiclecare
      POSTGRES_USER: vehiclecare
      POSTGRES_PASSWORD: vehiclecare_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehiclecare -d vehiclecare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
